name: Verify Current Focus Forms
on:
  push:
    paths:
      - 'src/app/focus/**'
      - 'src/app/f/**'
      - 'scripts/verify-focus-forms.mjs'
      - 'scripts/qa-forms-routes.json'
      - '.github/workflows/focus-forms-verify.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 12 * * *' # Daily UTC health check; read-only, no user data created
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check all active-focus form configurations
        run: node scripts/verify-focus-forms.mjs
