name: KHG Forms Visual + Validation Screenshots
on:
  push:
    paths:
      - 'scripts/qa-form-visual.mjs'
      - '.github/workflows/visual-forms-qa.yml'
  workflow_dispatch:
jobs:
  screenshots:
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright@1.56.0
      - run: npx playwright install --with-deps chromium
      - name: Screenshot desktop/mobile, validate, simulate safely
        env:
          QA_SHARD: ${{ matrix.shard }}
          QA_TOTAL: 8
        run: node scripts/qa-form-visual.mjs
      - name: Preserve screenshots and QA logs, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: khg-forms-qa-shard-${{ matrix.shard }}
          path: qa-results/
          retention-days: 30
          if-no-files-found: warn
